name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  linux-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Собрать движок Fairy-Stockfish с нейросетью Чанги
        run: node scripts/fetch-engine.mjs --rebuild
      - name: Проверить движок
        run: node scripts/engine-smoke.mjs src-tauri/engine/fairy-stockfish
      - uses: actions/upload-artifact@v4
        with:
          name: fairy-stockfish-linux
          path: src-tauri/engine/fairy-stockfish

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Скачать движок Fairy-Stockfish (NNUE для Чанги)
        run: npm run fetch-engine
      - name: Проверить движок
        run: node scripts/engine-smoke.mjs src-tauri/engine/fairy-stockfish.exe
      - name: Собрать установщик
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: janggi-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Установить Android NDK и SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "platforms;android-37.0" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Собрать движок Fairy-Stockfish для Android (NNUE для Чанги)
        run: npm run fetch-engine -- --android
      - name: Ключ подписи
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан отладочным ключом"
            exit 0
          fi
          cd src-tauri/gen/android/app
          echo "$KEYSTORE" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Собрать APK
        run: |
          npx tauri android build --apk --target aarch64
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk janggi-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: janggi-android
          path: janggi-android-arm64.apk
      - name: Опубликовать релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: janggi-android-arm64.apk
