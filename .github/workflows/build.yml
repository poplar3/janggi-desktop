name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Установить системные библиотеки
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Собрать движок Fairy-Stockfish с нейросетью Чанги
        run: node scripts/fetch-engine.mjs --rebuild
      - name: Проверить движок
        run: node scripts/engine-smoke.mjs src-tauri/engine/fairy-stockfish
      - name: Собрать AppImage и deb
        run: npx tauri build --bundles appimage,deb
      - uses: actions/upload-artifact@v4
        with:
          name: fairy-stockfish-linux
          path: src-tauri/engine/fairy-stockfish
      - uses: actions/upload-artifact@v4
        with:
          name: janggi-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Скачать движок Fairy-Stockfish (NNUE для Чанги)
        run: npm run fetch-engine
      - name: Проверить движок
        run: node scripts/engine-smoke.mjs src-tauri/engine/fairy-stockfish.exe
      - name: Собрать установщик
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: janggi-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # NDK уже установлен на сборщике; недостающую платформу SDK Gradle скачает сам.
      - name: Найти Android NDK
        run: |
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Собрать движок Fairy-Stockfish для Android (NNUE для Чанги)
        run: npm run fetch-engine -- --android
      - name: Ключ подписи
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::notice::Секрет ANDROID_KEYSTORE_BASE64 не задан — APK подписан отладочным ключом"
            exit 0
          fi
          cd src-tauri/gen/android/app
          echo "$KEYSTORE" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      - name: Собрать APK
        run: |
          npx tauri android build --apk --target aarch64
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk janggi-android-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: janggi-android
          path: janggi-android-arm64.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: janggi-*
          path: dist
          merge-multiple: true
      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
